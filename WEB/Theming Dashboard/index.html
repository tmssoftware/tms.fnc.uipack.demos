<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="A themed dashboard: switch between Light and Dark, follow the system, pick an accent color or take the theme from the page's Bootstrap 5.3 (color mode, Bootswatch themes)"/>
    <link rel="icon" href="data:;base64,="/>
    <title>TMS FNC UI Pack - Theming Dashboard</title>
    <!-- Bootstrap 5.3: the 'Bootstrap' theme reads its CSS variables; the demo replaces the href with a Bootswatch theme -->
    <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <script src="$(ProjectName).js" type="text/javascript"></script>
    <style>
      /* after Bootstrap, so that its reboot leaves the page as it was (font, colors, line height) */
      /* the form fills the page; the theme manager colors it ('Fluent Light' window background) */
      html, body { margin: 0; height: 100%; }
      body { background: #F4F5F7; color: #1F2328; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
             font-size: 16px; line-height: normal; }
      /* the header of a form's HTML template (title and description elements), as the FNC demo header */
      .demo-header { padding: 12px 24px 4px; }
      .demo-title { font-size: 20px; font-weight: 600; line-height: 30px; }
      .demo-description { font-size: 13px; line-height: 20px; color: #5B6470; }
      .appcontent { position: relative; }
      /* the dashboard lays itself out for the window size; its bars reach past the window's edges
         (as in the VCL and FMX versions), which are clipped, not scrolled to */
      html { overflow: hidden; }
      body { position: relative; overflow: clip; }
      /* the native Bootstrap card of the form's template (UDemo.html), right in the Bootstrap bar */
      .bootstrap-sample { position: absolute; top: 0; right: 0; max-width: calc(100% - 420px); height: 100%; flex-direction: row;
                          align-items: center; gap: 8px; padding: 0 4px; overflow: hidden; white-space: nowrap;
                          font-family: var(--bs-body-font-family); font-size: .875rem; line-height: 1.5; }
      .bootstrap-sample .alert { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .bootstrap-sample .form-control { width: 150px; flex: none; }
    </style>
  </head>
  <body>
  </body>
  <script type="text/javascript">
    rtl.run();
  </script>
</html>
