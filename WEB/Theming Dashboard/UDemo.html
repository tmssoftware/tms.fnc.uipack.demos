    <!-- native Bootstrap next to the FNC controls: a card with an alert, a form control, a badge and buttons (the form

      <div class="alert alert-info py-1 px-2 mb-0">Native Bootstrap elements</div>
      <input class="form-control form-control-sm" type="text" placeholder="form-control"/>
      <span class="badge text-bg-success">badge</span>
      <button type="button" class="btn btn-sm btn-outline-secondary">Outline</button>
      <button type="button" class="btn btn-sm btn-primary">Primary</button>
    </div>
